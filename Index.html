<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineVault">
  <title>CineVault</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #16181f;
      --accent: #3b82f6;
      --text: #ffffff;
      --subtext: #8e95a5;
      --border: #232733;
      --star: #fbbf24;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      min-height: 100vh;
    }
    header {
      padding: 24px 0 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .badge-count {
      background: var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--subtext);
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--border);
      color: var(--text);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 80px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
    }
    .platform-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #93c5fd;
    }
    .card-desc {
      font-size: 13px;
      color: var(--subtext);
      line-height: 1.4;
    }
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 4px;
    }
    .rating-select {
      background: var(--bg);
      color: var(--star);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-remove {
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 13px;
      cursor: pointer;
      margin-left: 8px;
    }
    .floating-add {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      left: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    .btn-bottom {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>I Miei Titoli</h1>
      <div style="font-size: 12px; color: var(--subtext); margin-top: 2px;">Database Personale</div>
    </div>
    <span class="badge-count" id="totalCount">0 titoli</span>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabWatchlist" onclick="setTab('watchlist')">Da Vedere</button>
    <button class="tab-btn" id="tabWatched" onclick="setTab('watched')">Visti & Votati</button>
  </div>

  <div class="filters" id="platformFilters">
    <button class="filter-btn active" onclick="setPlatformFilter('Tutte')">Tutte</button>
    <button class="filter-btn" onclick="setPlatformFilter('HBO Max')">HBO Max</button>
    <button class="filter-btn" onclick="setPlatformFilter('Sky / NOW')">Sky / NOW</button>
    <button class="filter-btn" onclick="setPlatformFilter('Apple TV+')">Apple TV+</button>
    <button class="filter-btn" onclick="setPlatformFilter('Disney+')">Disney+</button>
    <button class="filter-btn" onclick="setPlatformFilter('Prime Video')">Prime Video</button>
    <button class="filter-btn" onclick="setPlatformFilter('Netflix')">Netflix</button>
  </div>

  <div class="card-list" id="mediaList"></div>

  <div class="floating-add">
    <button class="btn-bottom btn-secondary" onclick="exportData()">Copia per Chat</button>
    <button class="btn-bottom btn-primary" onclick="addNewTitle()">+ Aggiungi</button>
  </div>

  <script>
    const defaultData = [
      { id: 1, title: "The Night Of", platform: "HBO Max", type: "Miniserie", desc: "Tensione claustrofobica. Un ragazzo accusato di omicidio a Manhattan.", status: "watchlist", rating: null },
      { id: 2, title: "Omicidio a Easttown", platform: "HBO Max", type: "Miniserie", desc: "Detective di provincia con Kate Winslet, ritmo serrato.", status: "watchlist", rating: null },
      { id: 3, title: "Sicario", platform: "Prime Video", type: "Film", desc: "Tensione millimetrica al confine USA-Messico.", status: "watchlist", rating: null },
      { id: 4, title: "The Bear", platform: "Disney+", type: "Serie", desc: "Adrenalina pura e ritmo forsennato nella cucina di Chicago.", status: "watchlist", rating: null },
      { id: 5, title: "Ted Lasso", platform: "Apple TV+", type: "Serie", desc: "Commedia brillante, cuore e motivazione.", status: "watched", rating: 9 },
      { id: 6, title: "Shrinking", platform: "Apple TV+", type: "Serie", desc: "Ideata dagli stessi autori di Scrubs, brillante e toccante.", status: "watched", rating: 9 },
      { id: 7, title: "Le Mans '66", platform: "Disney+", type: "Film", desc: "Cameratismo, sfide leggendarie e motori.", status: "watched", rating: 8.5 }
    ];

    let items = JSON.parse(localStorage.getItem("cinevault_items")) || defaultData;
    let currentTab = "watchlist";
    let currentPlatform = "Tutte";

    function save() {
      localStorage.setItem("cinevault_items", JSON.stringify(items));
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById("tabWatchlist").classList.toggle("active", tab === "watchlist");
      document.getElementById("tabWatched").classList.toggle("active", tab === "watched");
      render();
    }

    function setPlatformFilter(plat) {
      currentPlatform = plat;
      const btns = document.querySelectorAll("#platformFilters .filter-btn");
      btns.forEach(b => b.classList.toggle("active", b.innerText === plat));
      render();
    }

    function changeRating(id, rating) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.rating = rating ? parseFloat(rating) : null;
        if (item.rating && item.status === "watchlist") item.status = "watched";
        save();
      }
    }

    function toggleStatus(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.status = item.status === "watchlist" ? "watched" : "watchlist";
        save();
      }
    }

    function removeItem(id) {
      items = items.filter(i => i.id !== id);
      save();
    }

    function addNewTitle() {
      const title = prompt("Titolo del film o serie:");
      if (!title) return;
      const platform = prompt("Piattaforma (es. HBO Max, Apple TV+, Netflix, Disney+, Prime Video):", "HBO Max") || "Streaming";
      items.unshift({
        id: Date.now(),
        title: title,
        platform: platform,
        type: "Titolo",
        desc: "Aggiunto manualmente",
        status: currentTab,
        rating: currentTab === "watched" ? 8 : null
      });
      save();
    }

    function exportData() {
      const text = items.map(i => `${i.title} (${i.platform}) - ${i.status === 'watched' ? 'Voto: ' + (i.rating || 'ND') : 'Da vedere'}`).join("\n");
      navigator.clipboard.writeText(text).then(() => {
        alert("Lista copiata negli appunti! Incollala qui in chat quando vuoi un nuovo consiglio.");
      });
    }

    function render() {
      const list = document.getElementById("mediaList");
      list.innerHTML = "";

      const filtered = items.filter(i => {
        const matchesTab = i.status === currentTab;
        const matchesPlat = currentPlatform === "Tutte" || i.platform.toLowerCase().includes(currentPlatform.toLowerCase());
        return matchesTab && matchesPlat;
      });

      document.getElementById("totalCount").innerText = `${filtered.length} visualizzati`;

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--subtext); padding: 40px 0;">Nessun titolo in questa sezione.</div>`;
        return;
      }

      filtered.forEach(i => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">${i.title}</div>
              <div style="font-size: 12px; color: var(--subtext); margin-top: 2px;">${i.type}</div>
            </div>
            <span class="platform-tag">${i.platform}</span>
          </div>
          <div class="card-desc">${i.desc}</div>
          <div class="card-actions">
            <div>
              <label style="font-size: 12px; color: var(--subtext); margin-right: 6px;">Voto:</label>
              <select class="rating-select" onchange="changeRating(${i.id}, this.value)">
                <option value="">-</option>
                ${[10, 9.5, 9, 8.5, 8, 7.5, 7, 6.5, 6, 5].map(v => `<option value="${v}" ${i.rating === v ? 'selected' : ''}>${v} ★</option>`).join('')}
              </select>
            </div>
            <div>
              <button class="btn-action" onclick="toggleStatus(${i.id})">${i.status === 'watchlist' ? 'Segna Visto' : 'Da Vedere'}</button>
              <button class="btn-remove" onclick="removeItem(${i.id})">✕</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
