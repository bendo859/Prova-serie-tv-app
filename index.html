<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineVault">
  <title>CineVault</title>
  <style>
    :root {
      --text: #ffffff;
      --subtext: #94a3b8;
      --card: rgba(22, 27, 38, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #ec4899;
      --star: #fbbf24;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      color: #fff;
      padding: env(safe-area-inset-top, 24px) 16px 110px 16px;
      min-height: 100vh;
      background-attachment: fixed;
      transition: background 0.3s;
    }

    /* SFONDI */
    body.neon {
      background-color: #0b0813;
      background-image: 
        radial-gradient(at 0% 10%, rgba(236, 72, 153, 0.45) 0, transparent 50%),
        radial-gradient(at 100% 20%, rgba(139, 92, 246, 0.4) 0, transparent 50%),
        radial-gradient(at 50% 90%, rgba(6, 182, 212, 0.35) 0, transparent 60%);
      --accent: #ec4899;
    }
    body.sunset {
      background-color: #120a1c;
      background-image: 
        radial-gradient(at 10% 10%, rgba(249, 115, 22, 0.5) 0, transparent 50%),
        radial-gradient(at 90% 30%, rgba(217, 70, 239, 0.4) 0, transparent 50%),
        radial-gradient(at 40% 95%, rgba(168, 85, 247, 0.45) 0, transparent 55%);
      --accent: #f97316;
    }
    body.cinema {
      background-color: #0d0608;
      background-image: 
        radial-gradient(at 90% 10%, rgba(225, 29, 72, 0.5) 0, transparent 50%),
        radial-gradient(at 10% 40%, rgba(245, 158, 11, 0.35) 0, transparent 45%),
        radial-gradient(at 70% 90%, rgba(159, 18, 57, 0.5) 0, transparent 55%);
      --accent: #e11d48;
    }
    body.slate {
      background-color: #0d1117;
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.8) 0, transparent 50%),
        radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.35) 0, transparent 45%),
        radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.95) 0, transparent 60%);
      --accent: #2563eb;
    }

    header {
      padding: 16px 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .header-btns {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-header {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    /* Selettore Temi */
    .themes {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .themes::-webkit-scrollbar { display: none; }
    .theme-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .theme-btn.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .tab {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    /* Filtri */
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter.active {
      background: #fff;
      color: #000;
      font-weight: 700;
    }

    /* Card */
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
    }
    .card-desc {
      font-size: 13px;
      color: var(--subtext);
      line-height: 1.4;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      margin-top: 4px;
    }
    select.vote {
      background: #000;
      color: var(--star);
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .btn-toggle {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-del {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Barra Basso */
    .bottom-bar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 10px);
      left: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 50;
    }
    .btn-main {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-add { background: var(--accent); color: #fff; }
    .btn-copy { background: rgba(30, 41, 59, 0.95); color: #fff; border: 1px solid var(--border); }

    /* Modali */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #181b24;
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      padding: 20px 16px calc(env(safe-area-inset-bottom, 20px) + 16px) 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input {
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }
    .backup-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-backup {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color
