<!DOCTYPE html>
<html lang="it" style="background-color: #0b0813;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineVault">
  <title>CineVault</title>
  <style>
    :root {
      --text: #f8fafc;
      --subtext: #94a3b8;
      --card-bg: rgba(22, 27, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.12);
      --modal-bg: #151924;
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.35);
      --star: #fbbf24;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0813;
      color: #f8fafc;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      min-height: 100vh;
      background-attachment: fixed;
      transition: background 0.3s ease;
    }

    /* Temi */
    body.theme-neon {
      background-color: #0b0813;
      background-image: 
        radial-gradient(at 0% 10%, rgba(236, 72, 153, 0.38) 0px, transparent 50%),
        radial-gradient(at 100% 20%, rgba(139, 92, 246, 0.35) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(6, 182, 212, 0.3) 0px, transparent 60%);
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.4);
      --modal-bg: #160f24;
    }

    body.theme-sunset {
      background-color: #120a1c;
      background-image: 
        radial-gradient(at 10% 10%, rgba(249, 115, 22, 0.42) 0px, transparent 48%),
        radial-gradient(at 90% 30%, rgba(217, 70, 239, 0.35) 0px, transparent 50%),
        radial-gradient(at 40% 95%, rgba(168, 85, 247, 0.4) 0px, transparent 55%);
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.4);
      --modal-bg: #1f112e;
    }

    body.theme-cinema {
      background-color: #0d0608;
      background-image: 
        radial-gradient(at 90% 10%, rgba(225, 29, 72, 0.4) 0px, transparent 50%),
        radial-gradient(at 10% 40%, rgba(245, 158, 11, 0.28) 0px, transparent 45%),
        radial-gradient(at 70% 90%, rgba(159, 18, 57, 0.42) 0px, transparent 55%);
      --accent: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.4);
      --modal-bg: #1c0d12;
    }

    body.theme-slate {
      background-color: #0d1117;
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.7) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.25) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 60%);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --modal-bg: #151924;
    }

    header {
      padding: 24px 0 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .badge-count {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--subtext);
      border: 1px solid var(--border);
    }

    .theme-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .theme-bar::-webkit-scrollbar { display: none; }
    .theme-chip {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .theme-chip.active {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
      font-weight: 600;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 95px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
    }
    .platform-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .card-desc {
      font-size: 13px;
      color: var(--subtext);
      line-height: 1.45;
    }
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
      margin-top: 4px;
      gap: 8px;
    }
    .rating-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rating-select {
      background: rgba(0, 0, 0, 0.5);
      color: var(--star);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-delete {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .floating-add {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      left: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .btn-bottom {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      border: 1px solid var(--border);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--modal-bg);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      width: 100%;
      padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 20px) 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-title { font-size: 19px; font-weight: 700; color: #fff; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 12px;
      color: var(--subtext);
      text-transform: uppercase;
      font-weight: 600;
    }
    .input-field, .select-field {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      width: 100%;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  </style>
</head>
<body class="theme-neon">

  <header>
    <div>
      <h1>I Miei Titoli</h1>
      <div style="font-size: 12px; color: var(--subtext); margin-top: 2px;">Database Personale</div>
    </div>
    <span class="badge-count" id="totalCount">0 titoli</span>
  </header>

  <!-- Selettore rapido sfondo -->
  <div class="theme-bar">
    <button class="theme-chip active" id="chip-theme-neon" onclick="setTheme('theme-neon')">⚡ Neon</button>
    <button class="theme-chip" id="chip-theme-sunset" onclick="setTheme('theme-sunset')">🌅 Sunset</button>
    <button class="theme-chip" id="chip-theme-cinema" onclick="setTheme('theme-cinema')">🍿 Cinema</button>
    <button class="theme-chip" id="chip-theme-slate" onclick="setTheme('theme-slate')">🌌 Slate</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabWatchlist" onclick="setTab('watchlist')">Da Vedere</button>
    <button class="tab-btn" id="tabWatched" onclick="setTab('watched')">Visti & Votati</button>
  </div>

  <div class="filters" id="platformFilters">
    <button class="filter-btn active" onclick="setPlatformFilter('Tutte')">Tutte</button>
    <button class="filter-btn" onclick="setPlatformFilter('HBO Max')">HBO Max</button>
    <button class="filter-btn" onclick="setPlatformFilter('Sky / NOW')">Sky / NOW</button>
    <button class="filter-btn" onclick="setPlatformFilter('Apple TV+')">Apple TV+</button>
    <button class="filter-btn" onclick="setPlatformFilter('Disney+')">Disney+</button>
    <button class="filter-btn" onclick="setPlatformFilter('Prime Video')">Prime Video</button>
    <button class="filter-btn" onclick="setPlatformFilter('Netflix')">Netflix</button>
  </div>

  <div class="card-list" id="mediaList"></div>

  <div class="floating-add">
    <button class="btn-bottom btn-secondary" onclick="exportData()">Copia per Chat</button>
    <button class="btn-bottom btn-primary" onclick="openAddModal()">+ Aggiungi</button>
  </div>

  <div class="modal-overlay" id="addModal" onclick
