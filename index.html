<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineVault">
  <title>CineVault</title>
  <style>
    :root {
      --card-bg: rgba(22, 27, 38, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --modal-bg: #151924;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --star: #fbbf24;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.7) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.22) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      min-height: 100vh;
    }
    header {
      padding: 24px 0 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-count {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--subtext);
      border: 1px solid var(--border);
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 95px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .platform-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      white-space: nowrap;
    }
    .card-desc {
      font-size: 13px;
      color: var(--subtext);
      line-height: 1.45;
    }
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      margin-top: 4px;
      gap: 8px;
    }
    .rating-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rating-select {
      background: rgba(15, 23, 42, 0.7);
      color: var(--star);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .btn-delete {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .floating-add {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      left: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .btn-bottom {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--modal-bg);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      width: 100%;
      padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 20px) 20px;
      box-shadow: 0 -12px 36px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-title {
      font-size: 19px;
      font-weight: 700;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      color: var(--subtext);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .input-field, .select-field {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      width: 100%;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>I Miei Titoli</h1>
      <div style="font-size: 12px; color: var(--subtext); margin-top: 2px;">Database Personale</div>
    </div>
    <span class="badge-count" id="totalCount">0 titoli</span>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabWatchlist" onclick="setTab('watchlist')">Da Vedere</button>
    <button class="tab-btn" id="tabWatched" onclick="setTab('watched')">Visti & Votati</button>
  </div>

  <div class="filters" id="platformFilters">
    <button class="filter-btn active" onclick="setPlatformFilter('Tutte')">Tutte</button>
    <button class="filter-btn" onclick="setPlatformFilter('HBO Max')">HBO Max</button>
    <button class="filter-btn" onclick="setPlatformFilter('Sky / NOW')">Sky / NOW</button>
    <button class="filter-btn" onclick="setPlatformFilter('Apple TV+')">Apple TV+</button>
    <button class="filter-btn" onclick="setPlatformFilter('Disney+')">Disney+</button>
    <button class="filter-btn" onclick="setPlatformFilter('Prime Video')">Prime Video</button>
    <button class="filter-btn" onclick="setPlatformFilter('Netflix')">Netflix</button>
  </div>

  <div class="card-list" id="mediaList"></div>

  <div class="floating-add">
    <button class="btn-bottom btn-secondary" onclick="exportData()">Copia per Chat</button>
    <button class="btn-bottom btn-primary" onclick="openAddModal()">+ Aggiungi</button>
  </div>

  <!-- Modal per Aggiungere Titoli -->
  <div class="modal-overlay" id="addModal" onclick="closeModalOnBg(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">Nuovo Titolo</div>

      <div class="form-group">
        <label>Titolo</label>
        <input type="text" id="newTitle" class="input-field" placeholder="Es. Mare of Easttown" autocomplete="off" />
      </div>

      <div class="form-group">
        <label>Piattaforma</label>
        <select id="newPlatform" class="select-field">
          <option value="HBO Max">HBO Max</option>
          <option value="Sky / NOW">Sky / NOW</option>
          <option value="Apple TV+">Apple TV+</option>
          <option value="Disney+">Disney+</option>
          <option value="Prime Video">Prime Video</option>
          <option value="Netflix">Netflix</option>
          <option value="Altro">Altro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipologia</label>
        <select id="newType" class="select-field">
          <option value="Miniserie">Miniserie</option>
          <option value="Serie">Serie TV</option>
          <option value="Film">Film</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-bottom btn-secondary" onclick="closeAddModal()">Annulla</button>
        <button class="btn-bottom btn-primary" onclick="saveNewTitle()">Salva</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      { id: 1, title: "The Night Of", platform: "HBO Max", type: "Miniserie", desc: "Tensione claustrofobica. Un ragazzo accusato di omicidio a Manhattan.", status: "watchlist", rating: null },
      { id: 2, title: "Omicidio a Easttown", platform: "HBO Max", type: "Miniserie", desc: "Detective di provincia con Kate Winslet, ritmo serrato.", status: "watchlist", rating: null },
      { id: 3, title: "Sicario", platform: "Prime Video", type: "Film", desc: "Tensione millimetrica al confine USA-Messico.", status: "watchlist", rating: null },
      { id: 4, title: "The Bear", platform: "Disney+", type: "Serie", desc: "Adrenalina pura e ritmo forsennato nella cucina di Chicago.", status: "watchlist", rating: null },
      { id: 5, title: "Ted Lasso", platform: "Apple TV+", type: "Serie", desc: "Commedia brillante, cuore e motivazione.", status: "watched", rating: 9 },
      { id: 6, title: "Shrinking", platform: "Apple TV+", type: "Serie", desc: "Ideata dagli stessi autori di Scrubs, brillante e toccante.", status: "watched", rating: 9 },
      { id: 7, title: "Le Mans '66", platform: "Disney+", type: "Film", desc: "Cameratismo, sfide leggendarie e motori.", status: "watched", rating: 8.5 }
    ];

    let items = JSON.parse(localStorage.getItem("cinevault_items")) || defaultData;
    let currentTab = "watchlist";
    let currentPlatform = "Tutte";

    function save() {
      localStorage.setItem("cinevault_items", JSON.stringify(items));
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById("tabWatchlist").classList.toggle("active", tab === "watchlist");
      document.getElementById("tabWatched").classList.toggle("active", tab === "watched");
      render();
    }

    function setPlatformFilter(plat) {
      currentPlatform = plat;
      const btns = document.querySelectorAll("#platformFilters .filter-btn");
      btns.forEach(b => b.classList.toggle("active", b.innerText === plat));
      render();
    }

    function changeRating(id, rating) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.rating = rating ? parseFloat(rating) : null;
        if (item.rating && item.status === "watchlist") item.status = "watched";
        save();
      }
    }

    function toggleStatus(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.status = item.status === "watchlist" ? "watched" : "watchlist";
        save();
      }
    }

    function confirmRemoveItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const confirmDelete = confirm(`Vuoi davvero eliminare "${item.title}"?`);
      if (confirmDelete) {
        items = items.filter(i => i.id !== id);
        save();
      }
    }

    function openAddModal() {
      document.getElementById("newTitle").value = "";
      document.getElementById("addModal").classList.add("active");
      setTimeout(() => document.getElementById("newTitle").focus(), 150);
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("active");
    }

    function closeModalOnBg(e) {
      if (e.target.id === "addModal") closeAddModal();
    }

    function saveNewTitle() {
      const title = document.getElementById("newTitle").value.trim();
      if (!title) {
        alert("Inserisci un titolo.");
        return;
      }
      const platform = document.getElementById("newPlatform").value;
      const type = document.getElementById("newType").value;

      items.unshift({
        id: Date.now(),
        title: title,
        platform: platform,
        type: type,
        desc: "Aggiunto manualmente",
        status: currentTab,
        rating: currentTab === "watched" ? 8 : null
      });

      closeAddModal();
      save();
    }

    function exportData() {
      const text = items.map(i => `${i.title} (${i.platform}) - ${i.status === 'watched' ? 'Voto: ' + (i.rating || 'ND') : 'Da vedere'}`).join("\n");
      navigator.clipboard.writeText(text).then(() => {
        alert("Lista copiata negli appunti! Incollala in chat quando vuoi un nuovo consiglio.");
      });
    }

    function render() {
      const list = document.getElementById("mediaList");
      list.innerHTML = "";

      const filtered = items.filter(i => {
        const matchesTab = i.status === currentTab;
        const matchesPlat = currentPlatform === "Tutte" || i.platform.toLowerCase().includes(currentPlatform.toLowerCase());
        return matchesTab && matchesPlat;
      });

      document.getElementById("totalCount").innerText = `${filtered.length} visualizzati`;

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--subtext); padding: 40px 0;">Nessun titolo in questa sezione.</div>`;
        return;
      }

      filtered.forEach(i => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">${i.title}</div>
              <div style="font-size: 12px; color: var(--subtext); margin-top: 2px;">${i.type}</div>
            </div>
            <span class="platform-tag">${i.platform}</span>
          </div>
          <div class="card-desc">${i.desc}</div>
          <div class="card-actions">
            <div class="rating-wrap">
              <label style="font-size: 12px; color: var(--subtext);">Voto:</label>
              <select class="rating-select" onchange="changeRating(${i.id}, this.value)">
                <option value="">-</option>
                ${[10, 9.5, 9, 8.5, 8, 7.5, 7, 6.5, 6, 5].map(v => `<option value="${v}" ${i.rating === v ? 'selected' : ''}>${v} ★</option>`).join('')}
              </select>
            </div>
            <div class="right-actions">
              <button class="btn-action" onclick="toggleStatus(${i.id})">${i.status === 'watchlist' ? 'Segna Visto' : 'Da Vedere'}</button>
              <button class="btn-delete" title="Elimina" onclick="confirmRemoveItem(${i.id})">🗑️ Elimina</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
